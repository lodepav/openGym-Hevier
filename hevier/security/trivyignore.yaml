# Accepted vulnerabilities (D26). `release-check.sh` runs Trivy over every lockfile, dev
# dependencies included, all severities; anything not listed here fails. Each entry is scoped to
# the exact package version (purls) and expires, so a new version or a lapsed review fails again.
#
# All of these come from @capacitor/assets, upstream's devDependency for regenerating icons and
# splashes from one source image. It runs only by hand (`npx capacitor-assets generate`), never
# in a build, and nothing of it ships; the fork recolours upstream's PNGs instead
# (hevier/tools/recolour-icons.py). Fixing it means dropping the package upstream (the solhren
# fork did, see PIPELINE.md): ask upstream, and drop these entries when it is gone.
vulnerabilities:
  - id: CVE-2026-23745
    purls: ["pkg:npm/tar@6.2.1"]
    statement: HIGH, @capacitor/assets dev tool, never run in a build or shipped
    expired_at: 2027-01-17
