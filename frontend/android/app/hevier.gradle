// [hevier] The fork's Android identity (seam S7: applied from the last line of build.gradle): its id, version, launcher name, icon and splash, portrait only, and a smaller release APK (D50).
// Its own application id, so it installs beside the official openGym instead of clashing with it.
// The debug build keeps upstream's ".test" suffix: ch.duartesantos.opengym.hevier.test.
// The Java namespace stays ch.duartesantos.opengym; only the id the device sees changes.
// Go Hevier's own version (D52), from hevier/VERSION, in place of upstream's: versionName as written,
// versionCode major·10000 + minor·100 + patch, so each fork release installs over the one before
// (minor and patch stay below 100).
def hevierVersion = file("$rootDir/../../hevier/VERSION").text.trim()
def hevierParts = hevierVersion.tokenize('.').collect { it as int }
android {
    defaultConfig {
        applicationId "ch.duartesantos.opengym.hevier"
        versionName hevierVersion
        versionCode hevierParts[0] * 10000 + hevierParts[1] * 100 + hevierParts[2]
    }
    // The launcher name. Build-type resources override src/main/res (that is how upstream's
    // src/debug names its test build), so app_name changes without editing upstream's strings.xml.
    // debug's folder is *replaced*, not added to (a second app_name in one source set is a
    // duplicate-resource error): if upstream ever puts more into src/debug/res, copy it across.
    // The app icon and splash are upstream's recoloured to Hevy blue (hevier/tools/recolour-icons.py),
    // in src/hevier/res, which both build types add the same way.
    sourceSets {
        release.res.srcDirs += ['src/hevier-release/res', 'src/hevier/res']
        debug.res.srcDirs = ['src/hevier-debug/res', 'src/hevier/res']
        // The fork's manifest overlay (D24: portrait only), merged into src/main's. Upstream has no
        // build-type manifest today; if it ever adds src/debug or src/release/AndroidManifest.xml,
        // these lines would hide it: move its contents into src/hevier/AndroidManifest.xml.
        debug.manifest.srcFile 'src/hevier/AndroidManifest.xml'
        release.manifest.srcFile 'src/hevier/AndroidManifest.xml'
        // The fork's Java plugins: D27's Health Connect reads (until upstream's v1.4.3 reads in its
        // own) and D34's encrypted secret.
        debug.java.srcDirs += ['src/hevier/java']
        release.java.srcDirs += ['src/hevier/java']
        // The fork's Java unit tests (./gradlew :app:testSideloadDebugUnitTest).
        test.java.srcDirs += ['src/hevier/test/java']
    }
    // D50: a smaller APK. Upstream's barcode scanner (ML Kit, with CameraX) only serves its gym
    // check-in, which the fork does not offer (D12): its native libraries and models are left out,
    // so a scan, were one ever started, would fail rather than run. With them gone the APK ships no
    // native code at all, so no ABI filter is needed and 32-bit phones keep installing it.
    packagingOptions {
        jniLibs.excludes += ['**/libbarhopper_v3.so', '**/libimage_processing_util_jni.so', '**/libsurface_util_jni.so']
    }
    androidResources.ignoreAssetsPattern = androidResources.ignoreAssetsPattern + ':<dir>mlkit_barcode_models'
    // The release build's Java is shrunk by R8. Capacitor's own rules keep every plugin's methods;
    // the fork's rules (src/hevier/proguard-rules.pro) add what is reached by name. Resources are
    // not shrunk: Capacitor finds notification icons by name, which R8 cannot see.
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'src/hevier/proguard-rules.pro'
        }
    }
}

// The APK's Java dependencies are locked (review G1), so Trivy can scan them as it scans the npm
// lockfiles (D26): every library that reaches the APK, Capacitor's, the plugins' and AndroidX's,
// is pinned in src/hevier/gradle.lockfile, and a build whose libraries differ from it fails until
// the lock is written again and its diff read (an upstream merge or a plugin bump does that):
//   cd frontend/android && ./gradlew :app:dependencies --write-locks
// Only the two runtime classpaths, which are what the APK ships: the sideload flavour's (upstream
// 1.4.2's flavours; the fork builds no play APK).
dependencyLocking {
    lockFile = file('src/hevier/gradle.lockfile')
}
configurations.matching { it.name in ['sideloadDebugRuntimeClasspath', 'sideloadReleaseRuntimeClasspath'] }.configureEach {
    resolutionStrategy.activateDependencyLocking()
}
